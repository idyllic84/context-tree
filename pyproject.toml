[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-tree"
version = "0.1.0.dev0"
description = "A context tree manager: one assistant between a user and coding agents, with long-term memory of the work and small, sufficient context for each execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["requests>=2.31,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
token-count = ["tiktoken>=0.9,<1"]

[project.scripts]
context-tree = "context_tree.pilot.__main__:main"
context-tree-auth = "context_tree.tools.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"context_tree.pilot" = ["static/*"]   # the pilot page
