name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: context-tree --help
      - name: offline tests
        shell: bash
        run: for f in tests/test_*.py; do PYTHONPATH=src python "$f" || exit 1; done
