<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CTM</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#1e1f22; --panel:#26282c; --raise:#2c2f34; --line:#3a3d42; --fg:#dcdfe4; --dim:#9a9fa8; --accent:#5aa9ff; --ok:#5bbf7a; --warn:#e0a84f;
          --err:#e06c6c; --user:#2f4a6b; --ctm:#2a2d33; --sel:#22406a; --hover:#2f3238; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 14px/1.55 "Segoe UI", "Microsoft YaHei UI", sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:6px 12px; border-bottom:1px solid var(--line); background:var(--panel); }
  header b { color:var(--accent); }
  button { background:#33363b; color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:2px 9px; cursor:pointer; font: inherit; font-size:12px; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#244a73; border-color:#36689c; }
  button.primary.on { background:#245a3a; border-color:#3f8f5a; }
  button.danger { color:var(--err); }
  button.link { background:none; border:none; color:var(--accent); padding:2px 4px; font-size:12px; }
  button.link:hover { text-decoration:underline; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:-1px; }
  input, textarea, select { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:4px; padding:4px 7px; font: inherit; font-size:13px; }
  .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .meta { font-size:12px; color:var(--dim); }
  .tag, .badge { display:inline-block; font-size:12px; line-height:17px; padding:0 5px; border-radius:3px; background:#3a3d42; color:#c3c8cf; white-space:nowrap; flex:none; }
  .badge.run { color:var(--accent); background:#21354d; animation: blink 1.4s infinite; }
  .badge.pin { color:#0d1a10; background:var(--ok); }
  .badge.warn { color:var(--warn); }
  @keyframes blink { 50% { opacity:.45; } }
  main { flex:1; display:flex; min-height:0; }

  /* ---- left: the task tree ---- */
  #left { width:clamp(220px, 24vw, 360px); flex:none; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #split, #split2 { width:5px; flex:none; cursor:col-resize; margin-left:-3px; z-index:1; }
  #split2 { margin-left:0; margin-right:-3px; }
  #split:hover, #split.drag, #split2:hover, #split2.drag { background:var(--accent); opacity:.5; }
  #treehead { display:flex; gap:6px; padding:6px 8px; border-bottom:1px solid var(--line); align-items:center; }
  #filter { flex:1; min-width:0; font-size:12px; }
  #tree { flex:1; overflow-y:auto; padding:4px 4px 16px; }
  .ti { display:flex; align-items:center; gap:5px; height:26px; padding-right:6px; border-radius:4px; cursor:default; user-select:none; }
  .ti:hover { background:var(--hover); }
  .ti[aria-selected="true"] { background:var(--sel); }
  .ti:focus { outline:none; }
  .ti:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
  .ti.drop { box-shadow: inset 0 0 0 2px var(--ok); }
  .ti.dragging { opacity:.45; }
  .ti .tw { width:16px; flex:none; text-align:center; color:#a3a9b3; font-size:12px; cursor:pointer; }
  .ti .tw:hover { color:var(--accent); }
  .ti .title { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ti.goal .title { font-weight:600; }
  .ti.cur .title { color:var(--accent); }
  .ti.root .title { color:var(--dim); }
  .ti input.rename { width:100%; padding:1px 4px; font-size:13px; }
  .cnt { font-size:12px; color:#a3a9b3; flex:none; }
  mark { background:#5a4a1a; color:inherit; border-radius:2px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); flex:none; display:inline-block; }
  .dot.running { background:var(--accent); } .dot.reported_done, .dot.done, .dot.accepted, .dot.verified { background:var(--ok); }
  .dot.blocked { background:var(--warn); } .dot.abandoned, .dot.paused, .dot.replaced { background:#555; }
  .dot.proposed { background:transparent; border:1px dashed var(--warn); } .dot.ready, .dot.pending { background:#7a8aa0; }
  #pend { max-height:25%; overflow-y:auto; border-top:1px solid var(--line); padding:6px 8px; font-size:12px; }
  #pend .pi { padding:2px 4px; border-radius:3px; cursor:pointer; } #pend .pi:hover { background:var(--hover); }

  /* ---- center: the conversation ---- */
  #center { flex:1; display:flex; flex-direction:column; min-width:360px; }
  #conv { flex:1; overflow-y:auto; padding:12px 18px; }
  footer { border-top:1px solid var(--line); padding:8px 12px; background:var(--panel); }
  #target { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--dim); margin-bottom:5px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--line); border-radius:12px; padding:0 9px; background:var(--raise); color:var(--fg); font-size:12px; }
  .chip.pinned { border-color:var(--ok); color:var(--ok); }
  .chip .x { background:none; border:none; color:inherit; padding:2px 4px; margin-right:-6px; min-width:22px; min-height:22px; font-size:15px; line-height:1; }
  #box { display:flex; gap:8px; }
  #input { flex:1; height:70px; resize:vertical; border-radius:6px; padding:6px 8px; font-size:14px; }
  .it { margin:8px 0; }
  .user { margin-left:20%; background:var(--user); border-radius:8px; padding:6px 10px; }
  .user .meta { display:flex; gap:8px; align-items:baseline; color:#a9b8cc; }
  .user .text { white-space:pre-wrap; }
  .user button.link { color:#d6e6ff; opacity:.85; }
  .ctm { margin-right:12%; background:var(--ctm); border-radius:8px; padding:6px 10px; }
  .ctm .body { white-space:pre-wrap; }
  .ctm.done { border-left:3px solid var(--ok); }
  .ctm.proxy { border-left:3px solid var(--accent); }
  .asks { margin-top:6px; border-left:3px solid var(--warn); background:#2e2a22; border-radius:4px; padding:4px 10px 5px; }
  .asks ol { margin:2px 0 0; padding-left:22px; } .asks li { margin:1px 0; } .asks .meta { margin-top:2px; }
  .hint { color:var(--dim); max-width:560px; margin:12% auto 0; line-height:1.8; font-size:13px; } .hint b { color:var(--fg); font-weight:600; }
  .ctm pre, .pg pre { white-space:pre-wrap; margin:4px 0; max-height:420px; overflow-y:auto; font: inherit; }
  .route { margin-right:12%; color:var(--dim); font-size:12px; padding-left:10px; } .route .secs { opacity:.7; }
  .route .to { color:var(--fg); }
  .pending { margin-right:12%; border-left:3px solid var(--warn); padding:4px 10px; background:#2e2a22; border-radius:4px; }
  .notice { color:var(--dim); font-size:12px; font-style:italic; }
  .dialogitem { margin-right:12%; border:1px solid var(--warn); border-radius:6px; padding:6px 8px; }
  .plan { margin-right:12%; border-left:3px solid var(--warn); padding:4px 10px; background:#2a2a2e; border-radius:4px; }

  /* ---- right: page, queries, executions ---- */
  #right { width:clamp(300px, 30vw, 520px); flex:none; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  #tabs { display:flex; gap:2px; padding:0 8px; border-bottom:1px solid var(--line); }
  #tabs button { background:none; border:none; border-bottom:2px solid transparent; border-radius:0; padding:7px 10px 5px; color:var(--dim); font-size:13px; }
  #tabs button[aria-selected="true"] { color:var(--fg); border-bottom-color:var(--accent); }
  #panel { flex:1; overflow-y:auto; padding:10px 12px; font-size:13px; }
  .pg .crumbs { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .pg .crumbs a, .pg a { color:var(--accent); cursor:pointer; }
  .pg h3 { margin:2px 0 4px; font-size:15px; }
  .pg .statusline { display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .pg .pill { display:inline-flex; gap:5px; align-items:center; border-radius:10px; padding:0 8px; font-size:12px; }
  .pg .purpose { margin:6px 0 2px; }
  .actbar { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .pg details.sec { margin:8px 0; }
  .pg details.sec > summary { cursor:pointer; color:var(--dim); font-size:12px; padding:2px 0; }
  .pg .li { padding:4px 0; border-bottom:1px dashed #33363b; } .pg .li a { display:inline-block; padding:2px 0; }
  .pg .li .acts { margin-left:4px; }
  .pg .old { color:var(--dim); text-decoration:line-through; }
  .pg .q { margin:6px 0; padding:5px 7px; background:var(--ctm); border-radius:4px; }
  .empty { color:var(--dim); padding:20px 6px; text-align:center; font-size:12px; }

  /* ---- menus, dialogs, toasts ---- */
  .menu { position:fixed; z-index:50; min-width:190px; background:#2b2e33; border:1px solid var(--line); border-radius:6px; padding:4px;
          box-shadow:0 8px 28px rgba(0,0,0,.5); }
  .menu button { display:flex; width:100%; justify-content:space-between; gap:18px; background:none; border:none; padding:5px 10px; font-size:13px; text-align:left; border-radius:4px; }
  .menu button:hover:not(:disabled), .menu button:focus { background:var(--sel); outline:none; }
  .menu .kbd { color:var(--dim); font-size:12px; }
  .menu .sep { height:1px; background:var(--line); margin:4px 2px; }
  dialog { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:14px 16px; width:min(540px, 92vw); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h3 { margin:0 0 6px; font-size:15px; }
  dialog label { display:block; font-size:12px; color:var(--dim); margin:10px 0 3px; }
  dialog input, dialog textarea, dialog select { width:100%; }
  dialog .where { display:flex; gap:8px; align-items:center; font-size:13px; }
  .dlg-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .picklist { max-height:52vh; overflow-y:auto; margin-top:8px; border:1px solid var(--line); border-radius:4px; }
  .pick { padding:4px 8px; cursor:pointer; } .pick:hover { background:var(--hover); } .pick[aria-selected="true"] { background:var(--sel); }
  .pick.goal > div:first-child { font-weight:600; }
  .pick .path { font-size:12px; color:var(--dim); }
  #toasts { position:fixed; left:16px; bottom:16px; display:flex; flex-direction:column; gap:6px; z-index:60; }
  .toast { background:#30343a; border:1px solid var(--line); border-radius:6px; padding:6px 12px; font-size:13px; box-shadow:0 6px 20px rgba(0,0,0,.4);
           display:flex; gap:12px; align-items:center; max-width:520px; }
  .keys td { padding:2px 10px 2px 0; font-size:13px; } .keys td:first-child { color:var(--accent); white-space:nowrap; }
</style>
</head>
<body>
<header>
  <b>CTM</b>
  <span id="ctm-busy" class="badge run" hidden title="CTM is handling a message or an executor's reply; the running states in the tree are still live">CTM is working…</span>
  <span style="flex:1"></span>
  <button id="btn-maintain" title="Have CTM look back over the tree and tidy it (normally automatic)">Tidy tree</button>
  <button id="btn-keys" title="Keyboard shortcuts">Shortcuts</button>
</header>
<main>
  <div id="left">
    <div id="treehead">
      <input id="filter" type="search" placeholder="Filter works (/)" aria-label="Filter works">
      <button id="btn-new" title="Create a work">New</button>
      <button id="btn-collapse" title="Collapse: expand only the running works and the current work">Collapse</button>
    </div>
    <div id="tree" role="tree" aria-label="Task tree"></div>
    <div id="pend"></div>
  </div>
  <div id="split" title="Drag to resize; double-click to reset"></div>
  <div id="center">
    <div id="conv" aria-live="polite"></div>
    <footer>
      <div id="target"></div>
      <div id="box"><textarea id="input" placeholder="Talk to CTM (Enter to send, Shift+Enter for a new line)"></textarea><button id="send" class="primary">Send</button></div>
    </footer>
  </div>
  <div id="split2" title="Drag to resize the right pane; double-click to reset"></div>
  <div id="right">
    <div id="tabs" role="tablist">
      <button role="tab" id="tab-page" data-tab="page">Page</button>
      <button role="tab" id="tab-queries" data-tab="queries">Queries</button>
      <button role="tab" id="tab-executions" data-tab="executions">Executions</button>
    </div>
    <div id="panel" class="pg" role="tabpanel"></div>
  </div>
</main>
<div id="toasts" aria-live="polite"></div>
<script>
// ======================================================================================================================
// State and helpers
// ======================================================================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => (s ?? '').toString().replace(/[&<>"']/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const ST = {running: 'in progress', paused: 'paused', reported_done: 'done (self-reported)', accepted: 'accepted', verified: 'verified', abandoned: 'abandoned', blocked: 'blocked',
            pending: 'pending', ready: 'ready', proposed: 'proposed', reopened: 'reopened', replaced: 'replaced', done: 'done'};
const SETTABLE = ['running', 'paused', 'reported_done', 'accepted', 'abandoned', 'reopened'];
const TO = {existing: 'continue', side: 'question', new: 'new work', research: 'research', control: 'control', ask: 'asks you first', memory: 'remember'};
const fmt = (t) => t ? new Date(t * 1000).toLocaleString('zh-CN', {hour12: false}) : '';

let tree = {nodes: [], current: null, selection: null, pending: []};   // selection: the work the next message is pinned to
let byId = new Map(), kids = new Map();
let viewId = null, focusId = null, filter = '', renaming = null, rows = [];
let tab = 'page', docId = null;
const titles = {};

function index() {
  byId = new Map(tree.nodes.map((n) => [n.id, n]));
  kids = new Map();
  for (const n of tree.nodes) { const p = byId.has(n.parent) ? n.parent : ''; if (!kids.has(p)) kids.set(p, []); kids.get(p).push(n); }
  for (const a of kids.values()) a.sort((x, y) => (y.last || 0) - (x.last || 0));
}
const titleOf = (id) => id === 'ROOT' ? 'Global' : (byId.get(id) || {}).title || titles[id] || id || '';
const parentOf = (id) => { const p = (byId.get(id) || {}).parent; return byId.has(p) ? p : null; };
const pathOf = (id) => { const out = []; let x = parentOf(id); while (x) { out.unshift(x); x = parentOf(x); } return out; };
const isAncestor = (a, b) => { let x = parentOf(b); while (x) { if (x === a) return true; x = parentOf(x); } return false; };
const hl = (text, q) => {
  text = text || ''; if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
};

async function api(path, body) {
  const r = await fetch(path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  return r.json();
}
async function ui(op, args) {
  const r = await api('/api/ui', Object.assign({op}, args || {}));
  if (r && r.error) toast('Not done: ' + r.error);
  return r || {};
}

// ======================================================================================================================
// Toasts (results, with undo where the change can be reversed)
// ======================================================================================================================
function toast(text, action) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<span>${esc(text)}</span>`;
  if (action) {
    const b = document.createElement('button'); b.className = 'link'; b.textContent = action.label;
    b.onclick = async () => { t.remove(); await action.fn(); };
    t.appendChild(b);
  }
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), action ? 8000 : 4000);
}

// ======================================================================================================================
// Menus (context menu and "more" menus): keyboard navigable, closed by Esc, a click outside, scroll or resize
// ======================================================================================================================
let menuEl = null, menuReturn = null;
function closeMenu(restore = true) {
  if (!menuEl) return;
  menuEl.remove(); menuEl = null;
  if (restore && menuReturn && document.contains(menuReturn)) menuReturn.focus({preventScroll: true});
}
function showMenu(items, x, y) {
  closeMenu(false);
  menuReturn = document.activeElement;
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  for (const it of items) {
    if (it.sep) { const s = document.createElement('div'); s.className = 'sep'; m.appendChild(s); continue; }
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem'); b.disabled = !!it.disabled;
    if (it.danger) b.classList.add('danger');
    b.innerHTML = `<span>${it.checked ? '✓ ' : ''}${esc(it.label)}</span>${it.kbd ? `<span class="kbd">${esc(it.kbd)}</span>` : ''}`;
    b.onclick = () => { closeMenu(!it.keepFocus); it.fn(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r = m.getBoundingClientRect();
  m.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px';
  m.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
  menuEl = m;
  const btns = () => [...m.querySelectorAll('button:not(:disabled)')];
  (btns()[0] || m).focus();
  m.addEventListener('keydown', (e) => {
    const bs = btns(), i = bs.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') bs[(i + 1) % bs.length].focus();
    else if (e.key === 'ArrowUp') bs[(i - 1 + bs.length) % bs.length].focus();
    else if (e.key === 'Home') bs[0].focus();
    else if (e.key === 'End') bs[bs.length - 1].focus();
    else if (e.key === 'Escape') closeMenu();
    else if (e.key === 'Tab') { closeMenu(); return; }
    else return;
    e.preventDefault();
  });
}
function menuAt(el, items) { const r = el.getBoundingClientRect(); showMenu(items, r.left, r.bottom + 2); }
document.addEventListener('mousedown', (e) => { if (menuEl && !menuEl.contains(e.target)) closeMenu(false); });
addEventListener('resize', () => closeMenu(false));
document.addEventListener('scroll', () => closeMenu(false), true);

// ======================================================================================================================
// Dialogs: forms, confirmation, and a searchable picker of works
// ======================================================================================================================
function form({title, note = '', fields = [], submit = 'OK', danger = false, extra = null, onChange = null}) {
  return new Promise((resolve) => {
    const d = document.createElement('dialog');
    const field = (f, i) => {
      const id = 'f' + i, lab = `<label for="${id}">${esc(f.label)}</label>`;
      if (f.type === 'textarea') return lab + `<textarea id="${id}" name="${f.name}" rows="${f.rows || 4}" ${f.required ? 'required' : ''}>${esc(f.value || '')}</textarea>`;
      if (f.type === 'select') return lab + `<select id="${id}" name="${f.name}">${f.options.map((o) =>
        `<option value="${esc(o.value)}"${o.value === f.value ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      return lab + `<input id="${id}" name="${f.name}" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''} autocomplete="off">`;
    };
    d.innerHTML = `<form><h3>${esc(title)}</h3>${note ? `<div class="meta">${esc(note)}</div>` : ''}<div class="extra"></div>${fields.map(field).join('')}
      <div class="dlg-actions"><button type="button" data-cancel>Cancel</button><button type="submit" class="${danger ? 'danger' : 'primary'}">${esc(submit)}</button></div></form>`;
    document.body.appendChild(d);
    const frm = $('form', d);
    if (extra) extra($('.extra', d));
    const close = (v) => { d.close(); d.remove(); resolve(v); };
    $('[data-cancel]', d).onclick = () => close(null);
    d.addEventListener('cancel', (e) => { e.preventDefault(); close(null); });
    frm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!frm.reportValidity()) return;
      const v = {}; for (const f of fields) v[f.name] = frm.elements[f.name].value.trim();
      close(v);
    });
    if (onChange) frm.addEventListener('change', () => onChange(frm));
    d.showModal();
    const first = frm.querySelector('input, textarea, select');
    if (first) { first.focus(); if (first.select) first.select(); } else $('button[type=submit]', d).focus();
  });
}
const confirmDialog = (title, note, submit, danger = true) => form({title, note, submit, danger}).then((v) => v !== null);

function orderedNodes() {
  const out = [];
  const walk = (p) => (kids.get(p) || []).forEach((n) => { out.push(n); walk(n.id); });
  walk('');
  return out;
}
// Resolves with a node id, 'ROOT' (when allowed), or undefined when cancelled.
function pick({title, note = '', allowRoot = false, rootLabel = 'Root (under no work)', exclude = () => false}) {
  return new Promise((resolve) => {
    const d = document.createElement('dialog');
    d.innerHTML = `<h3>${esc(title)}</h3>${note ? `<div class="meta">${esc(note)}</div>` : ''}
      <input class="pq" type="search" placeholder="Type to filter; ↑↓ to choose, Enter to confirm" aria-label="Filter" style="margin-top:8px">
      <div class="picklist" role="listbox" aria-label="Works"></div><div class="dlg-actions"><button type="button" data-cancel>Cancel</button></div>`;
    document.body.appendChild(d);
    const inp = $('.pq', d), list = $('.picklist', d);
    const all = [...(allowRoot ? [{id: 'ROOT', title: rootLabel, path: ''}] : []),
                 ...orderedNodes().filter((n) => !exclude(n.id)).map((n) => ({id: n.id, title: n.title || n.id, status: n.status, goal: n.kind === 'goal',
                                                                              path: pathOf(n.id).map(titleOf).join(' › ')}))];
    let items = all, k = 0;
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      items = q ? all.filter((x) => x.title.toLowerCase().includes(q) || x.path.toLowerCase().includes(q) || x.id.toLowerCase() === q) : all;
      k = Math.max(0, Math.min(k, items.length - 1));

let typed = '', typedAt = 0;
function typeahead(ch) {

(() => {                                             // right-panel events (delegated)
  const P = $('#panel');
  P.addEventListener('click', async (e) => {

    if (!t) return;
    const id = viewId, d = t.dataset;
    if (d.open) { openPage(d.open); if (byId.has(d.open)) focusRowIfVisible(d.open); return; }
    if (d.doc) return openDoc(d.doc);
    if (d.record) return openRecord(d.record);
    if (t.hasAttribute('data-back')) { docId = null; return openPage(viewId); }
    if (d.cmove) {
      const target = await pick({title: 'Where this constraint goes', note: 'It holds for every work under where it is attached', allowRoot: true, rootLabel: 'Global (holds for all work)'});
      if (target !== undefined) { await ui('move_constraint', {constraint: d.cmove, node: target}); openPage(id, true); toast('Constraint moved'); }
      return;
    }
    if (d.dropinh) {
      if (await confirmDialog('This constraint does not apply to this work?', 'It stays on its own work; it is only no longer given to this work\'s executor.', 'Does not apply', false)) {
        await ui('drop_inherited', {node: id, constraint: d.dropinh}); openPage(id, true); toast('No longer given to this work');
      }
      return;
    }
    if (d.cobj) {
      const v = await form({title: 'Make it an object constraint', note: 'This requirement is a rule of an object itself; every later work touching the object will see it.', submit: 'Make it an object constraint',
                            fields: [{name: 'object', label: 'Object (file, module, directory or interface)', required: true}]});
      if (v) { await ui('constraint_kind', {constraint: d.cobj, kind: 'object', object: v.object}); openPage(id, true); toast('Made an object constraint'); }
      return;
    }
    if (d.root) {
      const v = await form({title: 'Edit', fields: [{name: 'text', label: 'Content', type: 'textarea', value: d.text, required: true}], submit: 'Save'});
      if (v) { await ui('edit_root', {item: d.root, text: v.text}); openPage('ROOT', true); toast('Saved'); }
      return;
    }
    if (d.editdoc) return editDoc(d.editdoc);
    switch (d.act) {
      case 'pin': return pin(tree.selection === id ? null : id);
      case 'status': return statusMenu(id, t);
      case 'stop': return stopRun(id);
      case 'approve': return approvePlan(id);
      case 'child': return createTask(id);
      case 'move': return pickMove(id);
      case 'merge': return pickMerge(id);
      case 'more': {
        const n = byId.get(id) || {};
        return menuAt(t, [{label: 'Rename…', kbd: 'F2', fn: () => renameDialog(id)}, {label: 'Edit purpose…', fn: () => purposeDialog(id)}, {label: 'Change status…', fn: () => statusMenu(id, t)},
                          ...(n.run ? [{label: 'View the execution record', fn: () => openRecord(n.run)}] : []),
                          {sep: true}, {label: 'Copy id ' + id, fn: () => navigator.clipboard && navigator.clipboard.writeText(id)}]);

  P.addEventListener('change', (e) => {

})();
function focusRowIfVisible(id) { if (document.getElementById('ti-' + id)) focusRow(id); else renderTree(); }

async function editDoc(id) {

function render(it) {
  const div = document.createElement('div');
  div.className = 'it';
  if (it.kind === 'user') {
    div.className += ' user';
    div.innerHTML = `<div class="meta"><span>turn ${it.turn}${it.selection ? ' · sent to "' + esc(titleOf(it.selection)) + '"' : ''}</span>`
      + `<button class="link" data-reattach="${it.turn}" title="This message really belongs to another work (changes memory only, nothing is run again)">Move…</button></div><div class="text">${esc(it.text)}</div>`;
  } else if (it.kind === 'relay') {
    if (it.node) titles[it.node] = it.title;
    const alts = (it.alternatives || []).map((a) => `<button class="link" data-redirect="${it.turn}" data-node="${a.id}">Deliver to "${esc(a.title)}" instead</button>`).join(' ');
    const ans = (it.answers || []).filter((a) => a.answer).map((a) => `<div class="ctm"><div class="body">${esc(a.answer)}</div></div>`).join('');
    div.className += ' route';
    div.innerHTML = `→ <span class="to">${it.title ? '"' + esc(it.title) + '"' : '(not for a particular work)'}</span><span class="tag">${esc(TO[it.to] || it.to || '')}</span>
      <span>${esc(it.text || '')}</span>${it.seconds != null ? `<span class="meta secs" title="Time CTM took for this message"> ${it.seconds}s</span>` : ''}
      ${alts ? ' · it may also be: ' + alts : ''} <button class="link" data-redirect="${it.turn}" title="Give this message to another work">Deliver elsewhere…</button>${ans}`;
  } else if (it.kind === 'ctm') {
    div.className += ' ctm' + (it.done ? ' done' : '') + (it.proxy ? ' proxy' : '');
    const head = it.proxy ? '' : `<div class="meta">"${esc(it.title)}"${it.query ? ': the answer (the full record is in the query panel)' : it.done ? ': done' : ': progress'}</div>`;
    const detail = it.query && it.detail && it.detail !== it.text ? `<details><summary>Full answer</summary><pre>${esc(it.detail)}</pre></details>` : '';
    div.innerHTML = `${head}${relayBody(it.text || '')}${detail}`;
  } else if (it.kind === 'pending') {
    div.className += ' pending'; div.innerHTML = it.type === 'proposal'
      ? `<b>CTM's proposal${it.withdrawn ? ' (withdrawn; no answer needed)' : ''}:</b> ${it.title ? `"${esc(it.title)}" ` : ''}${esc(it.text)}<div class="meta">${it.withdrawn ? 'The rule no longer holds' : 'Just answer; if you agree, this work\'s executor writes it'}</div>`
      : `<b>Needs your decision:</b> "${esc(it.title)}" ${esc(it.text)}<div class="meta">Just answer (it goes to this work)</div>`;
  } else if (it.kind === 'dialog') {
    const r = it.request || {};
    div.className += ' dialogitem'; div.dataset.run = it.run; div.dataset.req = r.id;
    let ctl = '';
    if (r.method === 'select') ctl = (r.options || []).map((o, i) => `<button data-dlg="value" data-i="${i}">${esc(o)}</button>`).join(' ');
    else if (r.method === 'confirm') ctl = '<button data-dlg="yes">Yes</button> <button data-dlg="no">No</button>';
    else ctl = `<input class="dlgval" aria-label="Answer"> <button data-dlg="text">OK</button>`;
    div.innerHTML = `<b>"${esc(it.title)}" needs your confirmation:</b> ${esc(r.title || '')} ${esc(r.message || '')}<div style="margin-top:4px">${ctl} <button data-dlg="cancel">Cancel</button></div>`;
    div._options = r.options || [];
  } else if (it.kind === 'plan') {
    div.className += ' plan';
    const rows_ = (it.subtasks || []).map((c) => `<div>· ${esc(c.title)} <span class="tag">${esc(ST[c.status] || c.status)}</span></div>`).join('');
    div.innerHTML = `<b>Plan of "${esc(it.title)}"</b> (authorized steps start right away; the others are proposals)${rows_}
      ${it.approved ? '<div class="meta">Approved</div>' : `<button data-approve="${it.task}">Approve these subtasks</button> <span class="meta">or edit or delete them in the tree first; you can also just say it in the conversation</span>`}`;
  } else if (it.kind === 'notice') {
    div.className += ' notice'; div.textContent = it.text;
  } else if (it.kind === 'ctmnote') {
    div.className += ' notice'; div.innerHTML = `<details${it.open ? ' open' : ''}><summary>CTM recorded (turn ${it.turn})</summary><pre>${esc(it.text)}</pre></details>`;
  } else {
    return null;
  }
  return div;
}
function relayBody(text) {                        // what the reply leaves for the user: a numbered block answerable by number
  const mark = 'For you to decide, or not done yet:', k = text.indexOf(mark);
  if (k < 0) return `<div class="body">${esc(text)}</div>`;
  const items = text.slice(k + mark.length).split('\n').map((l) => l.trim()).filter(Boolean).map((l) => l.replace(/^\d+[.)]\s*/, ''));
  const before = text.slice(0, k).trim();
  return `${before ? `<div class="body">${esc(before)}</div>` : ''}<div class="asks"><b>For you to decide, or not done yet</b><ol>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`
    + `<div class="meta">You can answer by number, for example "1 yes, 2 not now"</div></div>`;
}
function hint(show) {                               // an empty conversation says how it is used
  const h = $('#conv .hint');
  if (!show) { if (h) h.remove(); return; }
  if (h) return;
  const d = document.createElement('div'); d.className = 'hint';
  d.innerHTML = `<b>Just say what you want done or want to know.</b> CTM gives what is to be done to the executor of the right work; questions it can answer from memory it answers, the others go to a read-only execution.<br>`
    + `No need to name the work: just go on from the last thing; to switch to another work, select it in the tree on the left, or click "Send here" on its page.<br>`
    + `When an executor finishes, is blocked or needs your decision, the result is relayed here; the full reply is under "Executions" on the right.`;
  $('#conv').appendChild(d);
}
function append(it) {
  if (it.kind !== 'notice') hint(false);
  const d = render(it); if (!d) return;
  const conv = $('#conv');
  const atBottom = conv.scrollHeight - conv.scrollTop - conv.clientHeight < 80;
  conv.appendChild(d);
  if (atBottom) conv.scrollTop = conv.scrollHeight;
  if (it.kind === 'ctm' && it.query && tab === 'queries') renderQueries();
}
(() => {                                             // conversation events (delegated)
  $('#conv').addEventListener('click', async (e) => {

    } else if (d.redirect) {

      if (node !== undefined) { await ui('redirect', {turn: +d.redirect, node}); toast(`Delivered to "${titleOf(node)}"`); }
    } else if (d.approve) {

                : d.dlg === 'text' ? {value: $('.dlgval', box).value} : {cancelled: true};
      await ui('dialog', Object.assign({run, id}, ans));
      box.querySelectorAll('button, input').forEach((x) => x.disabled = true);
    }
  });

  if (e.target.closest('[data-choose]')) {
    const t = await pick({title: 'Which work the next message goes to', note: 'While pinned, messages all go to this work'});
    if (t !== undefined) pin(t);
  }
});
async function send() {
  const text = $('#input').value.trim();
  if (!text) return;
  const b = $('#send'); b.disabled = true; b.textContent = 'CTM is working…';
  $('#input').value = '';
  try {
    const r = await api('/api/message', {text});
    if (r.error) append({kind: 'notice', text: 'Error: ' + r.error});
  } finally { b.disabled = false; b.textContent = 'Send'; }
}

// ======================================================================================================================
// Global wiring
// ======================================================================================================================
let seenActive = null, busyTimer = null;
function revealActive() {                         // work that starts running shows up even under branches the user had collapsed
  const now = new Set(tree.nodes.filter((n) => n.busy || n.tidying).map((n) => n.id));
  const fresh = seenActive === null ? [...now] : [...now].filter((id) => !seenActive.has(id));
  seenActive = now;
  if (!fresh.length) return [];
  for (const id of fresh) { let x = parentOf(id); while (x) { userClosed.delete(x); x = parentOf(x); } }
  lsSet('ctm-closed', userClosed);
  return fresh;
}
async function refreshTree() {
  tree = await api('/api/tree'); index();
  const fresh = revealActive();
  renderTree();
  const T = $('#tree');
  if (fresh.length && !T.matches(':hover')) { const r = $('#ti-' + fresh[0]); if (r) r.scrollIntoView({block: 'nearest'}); }
  $('#ctm-busy').hidden = !tree.ctm_busy;
  clearTimeout(busyTimer); if (tree.ctm_busy) busyTimer = setTimeout(refreshTree, 3000);   // until CTM's step ends
  if (tab === 'executions') renderExecutions();
}
$('#send').onclick = send;
$('#input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });
$('#btn-new').onclick = () => createTask();
$('#btn-collapse').onclick = () => { userOpen = new Set(); userClosed = new Set(); lsSet('ctm-open', userOpen); lsSet('ctm-closed', userClosed); renderTree(); };
$('#btn-maintain').onclick = async () => { const b = $('#btn-maintain'); b.disabled = true; b.textContent = 'Tidying…';
  try { const r = await ui('maintain'); toast(`Tidied: ${r.ops ?? 0} adjustments`); await refreshTree(); } finally { b.disabled = false; b.textContent = 'Tidy tree'; } };
$('#btn-keys').onclick = () => {
  const d = document.createElement('dialog');
  d.innerHTML = `<h3>Keyboard shortcuts</h3><table class="keys">
    <tr><td>/</td><td>Filter the works in the tree</td></tr><tr><td>↑ ↓ Home End</td><td>Move in the tree</td></tr>
    <tr><td>→ ←</td><td>Expand, collapse; or go to a child, the parent</td></tr><tr><td>Enter</td><td>Open the page</td></tr>
    <tr><td>F2</td><td>Rename</td></tr><tr><td>Shift+F10 or right click</td><td>The menu of actions on this work</td></tr>
    <tr><td>*</td><td>Expand all works on the same level</td></tr><tr><td>Type a letter</td><td>Jump to a work starting with it</td></tr>
    <tr><td>Drag and drop</td><td>Drag a work onto another to make it part of it; onto "Global" to put it back at the root</td></tr>
    <tr><td>Enter / Shift+Enter</td><td>Send / new line in the input box</td></tr></table>
    <div class="dlg-actions"><button class="primary" autofocus>Got it</button></div>`;
  document.body.appendChild(d); $('button', d).onclick = () => { d.close(); d.remove(); }; d.addEventListener('close', () => d.remove()); d.showModal();
};
const F = $('#filter');
F.addEventListener('input', () => { filter = F.value; renderTree(); });
F.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { F.value = ''; filter = ''; renderTree(); focusRow(focusId); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 'Enter') { const r = rows[1] || rows[0]; if (r) focusRow(r.id); e.preventDefault(); }
});
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.querySelector('dialog[open]');
  if (e.key === '/' && !typing) { e.preventDefault(); F.focus(); F.select(); }
});

(() => {                                             // the right panel's width: drag its divider; double-click restores
  const right = $('#right'), sp = $('#split2');
  const saved = parseInt(localStorage.getItem('ctm-right-w') || '0', 10);
  if (saved) right.style.width = saved + 'px';
  let x0 = 0, w0 = 0;
  const move = (e) => { right.style.width = Math.round(Math.max(260, Math.min(innerWidth * 0.6, w0 - (e.clientX - x0)))) + 'px'; };
  const up = () => {
    sp.classList.remove('drag'); document.body.style.userSelect = ''; document.body.style.cursor = '';
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    localStorage.setItem('ctm-right-w', String(parseInt(right.style.width, 10)));
  };
  sp.addEventListener('mousedown', (e) => {
    x0 = e.clientX; w0 = right.getBoundingClientRect().width; sp.classList.add('drag');
    document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize';
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); e.preventDefault();
  });
  sp.addEventListener('dblclick', () => { right.style.width = ''; localStorage.removeItem('ctm-right-w'); });
})();
(() => {                                             // the tree panel's width: drag the divider; double-click restores
  const left = $('#left'), sp = $('#split');
  const saved = parseInt(localStorage.getItem('ctm-left-w') || '0', 10);
  if (saved) left.style.width = saved + 'px';
  let x0 = 0, w0 = 0;
  const move = (e) => { left.style.width = Math.round(Math.max(200, Math.min(innerWidth * 0.7, w0 + e.clientX - x0))) + 'px'; };
  const up = () => {
    sp.classList.remove('drag'); document.body.style.userSelect = ''; document.body.style.cursor = '';
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    localStorage.setItem('ctm-left-w', String(parseInt(left.style.width, 10)));
  };
  sp.addEventListener('mousedown', (e) => {
    x0 = e.clientX; w0 = left.getBoundingClientRect().width; sp.classList.add('drag');
    document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize';
    document.addEventListener('mousemove', move); document.addEventListener('mouseup', up); e.preventDefault();
  });
  sp.addEventListener('dblclick', () => { left.style.width = ''; localStorage.removeItem('ctm-left-w'); });
})();
$('#pend').addEventListener('click', (e) => { const el = e.target.closest('[data-open]'); if (el && el.dataset.open) openPage(el.dataset.open); });

(async () => {
  await refreshTree();
  showTab('page');
  const {items} = await api('/api/items');
  (items || []).forEach(append);
  hint(!(items || []).some((it) => it.kind !== 'notice'));
  const es = new EventSource('/api/events');
  let timer = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(refreshTree, 300); };
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === 'item') append(ev.item);
    else if (ev.type === 'tree' || ev.type === 'activity') later();
    else if (ev.type === 'error') append({kind: 'notice', text: ev.text});
  };
})();
</script>
